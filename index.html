<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e5ddd0"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A private little world of places, photographs, and moments together.">
<link rel="apple-touch-icon" href="/our-little-museum/icon-192.png"><link rel="icon" href="/our-little-museum/museum.svg"><link rel="manifest" href="/our-little-museum/manifest.webmanifest">
<title>Our Little World</title>  <script type="module" crossorigin src="/our-little-museum/assets/index-DA2E-bMM.js"></script>
  <link rel="stylesheet" crossorigin href="/our-little-museum/assets/index-DdZfLnSh.css">
</head><body>
<div id="stage">
  <div id="world"></div><div id="shade"></div><div id="labels"></div>
  <header class="topbar">
    <button id="home" class="wordmark"><span data-icon="museum"></span>our little world<span class="wordmark-dot">.</span></button>
    <div id="locationPill" class="glass"><span class="live-dot"></span><span id="placeName">Sunset Beach</span><span class="divider">/</span><span id="timeName">Golden hour</span></div>
    <button id="worldButton" class="glass profile"><span class="monogram">J & J</span><span id="coupleNames">Jayson & Jamie</span><i data-icon="down"></i></button>
  </header>
  <div id="welcome">
    <p class="eyebrow"><span></span>Somewhere only we know</p>
    <h1>A little world.<br><em>Just for us.</em></h1>
    <p>Our favorite places. Our favorite memories.<br>And a little more time together.</p>
    <div class="welcome-actions"><button id="enter" class="primary">Enter our world <i data-icon="arrow"></i></button><button id="makeYours" class="text-button">Make it yours <i data-icon="edit"></i></button></div>
  </div>
  <div id="sceneCaption"><span id="placeKicker">THE COAST</span><span id="zoneName">A sunset worth staying for</span></div>
  <div id="walkControls" hidden>
    <div id="joystick" role="group" aria-label="Movement joystick"><span></span></div>
    <div class="action-stack"><button id="recenter" class="glass circle" aria-label="Recenter camera"><i data-icon="crosshair"></i></button><button id="affection" class="glass circle" aria-label="Send a heart"><i data-icon="heart"></i></button><button id="snap" class="glass circle" aria-label="Take a couple picture"><i data-icon="camera"></i></button></div>
    <button id="prompt" class="glass" hidden><kbd>E</kbd><span></span><i data-icon="arrow"></i></button>
  </div>
  <nav id="dock" aria-label="World navigation">
    <button data-panel="places"><i data-icon="map"></i><span>Places</span></button>
    <button data-panel="memories"><i data-icon="image"></i><span>Memories</span></button>
    <button data-panel="editor"><i data-icon="sliders"></i><span>Customize</span></button>
    <span class="dock-rule"></span>
    <button data-panel="together"><i data-icon="people"></i><span>Together</span><b id="onlineDot"></b></button>
    <button data-panel="music"><i data-icon="music"></i><span>Sound</span></button>
    <button id="fullscreen" aria-label="Enter fullscreen"><i data-icon="expand"></i><span>Fullscreen</span></button>
    <button data-panel="guide" aria-label="Controls and settings"><i data-icon="help"></i><span>Guide</span></button>
  </nav>
  <div id="toast" role="status" hidden></div>
  <div id="loading"><i data-icon="museum"></i><h2>A place for the two of you.</h2><p id="loadMessage">Opening your little world</p><progress max="100" value="5"></progress></div>
</div>
<dialog id="panel"><div class="panel-top"><div><p class="eyebrow" id="panelEyebrow">OUR LITTLE WORLD</p><h2 id="panelTitle"></h2></div><button class="circle" id="closePanel" aria-label="Close panel"><i data-icon="close"></i></button></div><p id="panelFeedback" role="status" class="note" hidden></p><div id="panelBody"></div></dialog>
<dialog id="viewer"><button id="closeViewer" class="circle" aria-label="Close memory"><i data-icon="close"></i></button><div class="viewer-grid"><div class="photo-wrap"><img id="memoryImage" alt=""></div><article><p class="eyebrow" id="memoryCount"></p><h2 id="memoryTitle"></h2><p class="muted" id="memoryDate"></p><p id="memoryText"></p><blockquote id="letter"></blockquote><button id="viewTogether" class="subtle" hidden>Invite partner to view <i data-icon="people"></i></button><div class="viewer-nav"><button id="previous"><i data-icon="left"></i> Previous</button><button id="next">Next <i data-icon="right"></i></button></div></article></div></dialog>
<input type="file" id="backupInput" accept=".zip" hidden>
</body></html>
